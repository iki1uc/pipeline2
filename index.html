<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PIPELINE2 · 3·9·81 · Fusion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-primary: #0a0a12;
      --bg-secondary: #0e141c;
      --bg-card: #131a24;
      --bg-card-hover: #1c2634;
      --border-color: #1e2a3a;
      --text-primary: #e8edf5;
      --text-secondary: #9aa8c0;
      --text-muted: #5a6a7e;
      --gold: #ffd700;
      --blue: #4b7cf7;
      --green: #2ed98c;
      --red: #f25a6a;
      --purple: #a78bfa;
      --cyan: #4dd0e1;
      --shadow: 0 8px 32px rgba(0,0,0,0.7);
      --radius: 14px;
      --radius-sm: 8px;
      --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
    }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .container {
      max-width: 1400px;
      width: 100%;
      background: var(--bg-secondary);
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow);
      padding: 24px 28px 32px;
    }

    /* ─── HEADER ─── */
    .header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      gap: 12px;
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .header-left .logo {
      width: 44px; height: 44px;
      background: var(--gold);
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; color: #000;
      box-shadow: 0 0 24px rgba(255,215,0,0.25);
    }
    .header-left h1 {
      font-weight: 700; font-size: 24px; letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--gold), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header-left h1 small {
      font-weight: 400;
      -webkit-text-fill-color: var(--text-muted);
      font-size: 14px;
      margin-left: 6px;
    }
    .header-right {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .badge-pipeline {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 100px;
      padding: 4px 16px;
      font-size: 12px;
      color: var(--text-secondary);
      display: flex; align-items: center; gap: 8px;
    }
    .badge-pipeline .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--gold);
      animation: pulse-dot 1.8s infinite;
    }
    @keyframes pulse-dot {
      0%,100%{ opacity:1; transform:scale(1); }
      50%{ opacity:0.4; transform:scale(1.2); }
    }

    /* ─── STEADY‑LINE: FIXPUNKT + MODUS ─── */
    .steady-line {
      display: flex; flex-wrap: wrap;
      align-items: center;
      gap: 20px 32px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 12px 20px;
      margin-bottom: 24px;
    }
    .steady-item {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px;
      color: var(--text-secondary);
    }
    .steady-item .value {
      font-weight: 700;
      color: var(--text-primary);
    }
    .steady-item .value.gold { color: var(--gold); }
    .steady-item .value.cyan { color: var(--cyan); }
    .steady-item .value.purple { color: var(--purple); }
    .steady-item .badge-mode {
      background: rgba(255,215,0,0.12);
      border: 1px solid rgba(255,215,0,0.25);
      padding: 2px 14px;
      border-radius: 100px;
      font-weight: 600;
      font-size: 13px;
      color: var(--gold);
    }

    /* ─── STATS: 3·9·81 ─── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }
    @media (max-width: 720px) { .stats-grid { grid-template-columns: 1fr 1fr; } }
    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
    }
    .stat-card .label {
      font-size: 11px;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    .stat-card .value {
      font-size: 28px;
      font-weight: 700;
      margin-top: 2px;
    }
    .stat-card .value.gold { color: var(--gold); }
    .stat-card .value.blue { color: var(--blue); }
    .stat-card .value.purple { color: var(--purple); }
    .stat-card .value.green { color: var(--green); }

    /* ─── PIPELINE‑FLOW ─── */
    .flow-section {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 20px 18px;
      margin-bottom: 24px;
      overflow-x: auto;
    }
    .flow-section .title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 16px;
      display: flex; align-items: center; gap: 10px;
    }
    .flow-section .title i { color: var(--gold); }
    .pipeline-stages {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: nowrap;
      min-width: fit-content;
    }
    .stage-node {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 110px;
      transition: var(--transition);
      opacity: 0.5;
      filter: grayscale(0.5);
    }
    .stage-node.active { opacity: 1; filter: grayscale(0); }
    .stage-node.disabled { opacity: 0.2; pointer-events: none; }
    .node-ring {
      width: 72px; height: 72px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      background: var(--bg-secondary);
      border: 2px solid var(--border-color);
      color: var(--text-muted);
      transition: var(--transition);
      position: relative;
    }
    .node-ring .gear {
      font-size: 32px;
      transition: transform 0.3s;
    }
    .stage-node.running .node-ring .gear {
      animation: spin-gear 1.6s cubic-bezier(0.4,0,0.2,1) infinite;
    }
    @keyframes spin-gear {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.08); }
      100% { transform: rotate(360deg) scale(1); }
    }
    .node-ring .status-ring {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 3px solid transparent;
      transition: var(--transition);
    }
    .stage-node.running .node-ring .status-ring {
      border-color: var(--gold);
      border-top-color: transparent;
      animation: spin-ring 0.9s linear infinite;
      box-shadow: 0 0 28px rgba(255,215,0,0.3);
    }
    @keyframes spin-ring { to { transform: rotate(360deg); } }
    .stage-node.success .node-ring {
      border-color: var(--green);
      background: rgba(46,217,140,0.12);
      color: var(--green);
    }
    .stage-node.running .node-ring {
      border-color: var(--gold);
      background: rgba(255,215,0,0.08);
      color: var(--gold);
    }
    .stage-node.failed .node-ring {
      border-color: var(--red);
      background: rgba(242,90,106,0.12);
      color: var(--red);
    }
    .node-label {
      margin-top: 10px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      text-align: center;
    }
    .node-sub {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .stage-connector {
      flex: 0 0 36px;
      height: 3px;
      background: var(--border-color);
      border-radius: 2px;
      transition: var(--transition);
      position: relative;
      min-width: 16px;
    }
    .stage-connector.success { background: var(--green); box-shadow: 0 0 16px rgba(46,217,140,0.3); }
    .stage-connector.running { background: var(--gold); box-shadow: 0 0 16px rgba(255,215,0,0.3); }
    .stage-connector.failed { background: var(--red); }
    .stage-connector::after {
      content: '';
      position: absolute;
      right: -6px;
      top: 50%;
      transform: translateY(-50%);
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-left: 8px solid var(--border-color);
      transition: var(--transition);
    }
    .stage-connector.success::after { border-left-color: var(--green); }
    .stage-connector.running::after { border-left-color: var(--gold); }

    /* ─── LOGS + MANUELL ─── */
    .activity-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }
    @media (max-width: 820px) { .activity-grid { grid-template-columns: 1fr; } }
    .panel {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
    }
    .panel-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px;
    }
    .panel-head h3 {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      display: flex; align-items: center; gap: 8px;
    }
    .panel-head h3 i { color: var(--gold); }
    .log-list {
      display: flex; flex-direction: column;
      gap: 6px;
      max-height: 160px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .log-list::-webkit-scrollbar { width: 3px; }
    .log-list::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
    .log-item {
      display: flex; align-items: flex-start;
      gap: 8px;
      padding: 5px 10px;
      background: var(--bg-secondary);
      border-radius: 6px;
      border-left: 3px solid var(--border-color);
      font-size: 12px;
    }
    .log-item .icon { font-size: 13px; flex-shrink: 0; width: 18px; text-align: center; }
    .log-item .text { color: var(--text-secondary); line-height: 1.3; }
    .log-item .text strong { color: var(--text-primary); }
    .log-item .time { font-size: 10px; color: var(--text-muted); flex-shrink: 0; margin-left: auto; }
    .log-item.success { border-left-color: var(--green); }
    .log-item.error { border-left-color: var(--red); }
    .log-item.warning { border-left-color: var(--gold); }
    .log-item.info { border-left-color: var(--blue); }

    /* ─── TRIGGER ─── */
    .trigger-area {
      display: flex; flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .btn-primary {
      background: var(--gold);
      border: none;
      color: #000;
      font-weight: 700;
      font-size: 14px;
      padding: 10px 30px;
      border-radius: 100px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 4px 24px rgba(255,215,0,0.25);
      font-family: inherit;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 36px rgba(255,215,0,0.4); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .btn-secondary {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      padding: 6px 16px;
      border-radius: 100px;
      font-size: 12px;
      cursor: pointer;
      transition: var(--transition);
      font-family: inherit;
    }
    .btn-secondary:hover { border-color: var(--gold); color: #fff; }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 600px) {
      .container { padding: 14px; }
      .header-left h1 { font-size: 18px; }
      .stage-node { min-width: 80px; }
      .node-ring { width: 56px; height: 56px; font-size: 22px; }
      .node-ring .gear { font-size: 24px; }
      .steady-line { flex-direction: column; align-items: flex-start; gap: 8px; }
    }
  </style>
</head>
<body>

<div class="container">

  <!-- ─── HEADER ─── -->
  <header class="header">
    <div class="header-left">
      <div class="logo"><i class="fas fa-cogs"></i></div>
      <h1>PIPELINE2 <small>· 3·9·81 · Fusion</small></h1>
    </div>
    <div class="header-right">
      <div class="badge-pipeline"><span class="dot"></span> UC‑Layer · aktiv</div>
    </div>
  </header>

  <!-- ─── STEADY‑LINE: FIXPUNKT + MODUS ─── -->
  <div class="steady-line">
    <div class="steady-item">
      <i class="fas fa-bullseye" style="color:var(--gold);"></i>
      Fixpunkt: <span class="value gold" id="fixDisplay">0.763</span>
    </div>
    <div class="steady-item">
      <i class="fas fa-wave-square" style="color:var(--cyan);"></i>
      Orbit‑Modus: <span class="badge-mode" id="modeDisplay">OCTA</span>
    </div>
    <div class="steady-item">
      <i class="fas fa-rotate" style="color:var(--purple);"></i>
      STATE: <span class="value purple" id="stateDisplay">STABIL</span>
    </div>
    <div class="steady-item">
      <i class="fas fa-clock" style="color:var(--text-muted);"></i>
      <span id="timestamp">—</span>
    </div>
  </div>

  <!-- ─── STATS: 3·9·81 ─── -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="label">⚡ Achse 3</div>
      <div class="value gold" id="metric3">–</div>
    </div>
    <div class="stat-card">
      <div class="label">🌀 Achse 9</div>
      <div class="value blue" id="metric9">–</div>
    </div>
    <div class="stat-card">
      <div class="label">🌟 Achse 81</div>
      <div class="value purple" id="metric81">–</div>
    </div>
    <div class="stat-card">
      <div class="label">✅ Fusioniert</div>
      <div class="value green" id="successCount">0</div>
    </div>
  </div>

  <!-- ─── PIPELINE‑FLOW ─── -->
  <div class="flow-section">
    <div class="title"><i class="fas fa-arrow-right"></i> Fusionsfluss · Zahnräder drehen</div>
    <div class="pipeline-stages" id="pipelineStages"></div>
  </div>

  <!-- ─── LOGS + MANUELL ─── -->
  <div class="activity-grid">
    <div class="panel">
      <div class="panel-head">
        <h3><i class="fas fa-terminal"></i> Fusions‑Logs</h3>
      </div>
      <div class="log-list" id="logList"></div>
    </div>
    <div class="panel">
      <div class="panel-head">
        <h3><i class="fas fa-hand-pointer"></i> Manuell</h3>
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn-secondary" id="btnP0">P0 · RAW</button>
        <button class="btn-secondary" id="btnP1">P1 · STRUCT</button>
        <button class="btn-secondary" id="btnP2">P2 · VECTOR</button>
      </div>
      <div style="margin-top:10px; font-size:11px; color:var(--text-muted);">
        <i class="fas fa-info-circle"></i> Deaktivierte Stufen werden übersprungen.
      </div>
    </div>
  </div>

  <!-- ─── TRIGGER ─── -->
  <div class="trigger-area">
    <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
      <button class="btn-secondary" id="btnReset"><i class="fas fa-undo"></i> Reset</button>
      <button class="btn-secondary" id="btnToggleMode"><i class="fas fa-exchange-alt"></i> <span id="modeLabel">SIM</span></button>
    </div>
    <button class="btn-primary" id="btnTrigger"><i class="fas fa-play"></i> Pipeline auslösen</button>
  </div>

</div>

<script>
"use strict";
/* ================================================================
   PIPELINE2 · 3·9·81 · Fusion
   ================================================================ */

  // ─── KONFIGURATION ──────────────────────────────────────────────
  const PIPELINE = [
    { id: 'P0', label: 'P0 · RAW', icon: 'fa-database', key: 'P0' },
    { id: 'P1', label: 'P1 · STRUCTURE', icon: 'fa-shapes', key: 'P1' },
    { id: 'P2', label: 'P2 · VECTOR', icon: 'fa-arrow-up-right-dots', key: 'P2' }
  ];

  // ─── STATE ──────────────────────────────────────────────────────
  const state = {
    mode: 'SIM',           // 'SIM' oder 'REAL'
    isRunning: false,
    activeStages: [true, true, true],
    status: PIPELINE.map(() => 'pending'),
    results: PIPELINE.map(() => null),
    logs: [],
    fix: 0.763,
    modeOrbit: 'OCTA',
    stateOrbit: 'STABIL'
  };

  // ─── DOM-REFS ──────────────────────────────────────────────────
  const $ = id => document.getElementById(id);
  const stagesEl = $('pipelineStages');
  const logEl = $('logList');
  const triggerBtn = $('btnTrigger');
  const resetBtn = $('btnReset');
  const toggleBtn = $('btnToggleMode');
  const modeLabel = $('modeLabel');
  const timestamp = $('timestamp');

  // ─── MODUL‑SIMULATION (Mock) ──────────────────────────────────
  const moduleCache = {
    coreScan: () => ({ respo360: { x: 3, y: 9, z: 81 } }),
    P0: { run: () => ({ drei: Math.floor(Math.random()*99)+1, status: 'RAW' }) },
    P1: { run: () => ({ neun: Math.floor(Math.random()*199)+50, status: 'STRUCT' }) },
    P2: { run: () => ({ einundachtzig: Math.floor(Math.random()*499)+100, status: 'VECTOR' }) }
  };

  // ─── HELPER ────────────────────────────────────────────────────
  function getTime() {
    const now = new Date();
    return String(now.getHours()).padStart(2,'0') + ':' +
           String(now.getMinutes()).padStart(2,'0') + ':' +
           String(now.getSeconds()).padStart(2,'0');
  }

  function updateTimestamp() {
    timestamp.textContent = getTime();
  }

  function getModeFromFix(fix) {
    if (fix < 0.33) return 'IQQ';
    if (fix < 0.66) return 'NC';
    if (fix < 0.88) return 'OCTA';
    return 'A81';
  }

  // ─── RENDER ────────────────────────────────────────────────────
  function renderStages() {
    let html = '';
    state.status.forEach((status, idx) => {
      const mod = PIPELINE[idx];
      const active = state.activeStages[idx];
      const cls = status;
      let iconHtml = `<i class="fas ${mod.icon} gear"></i>`;
      if (status === 'running') iconHtml = `<i class="fas fa-gear gear"></i>`;

      html += `
        <div class="stage-node ${cls} ${active ? 'active' : 'disabled'}">
          <div class="node-ring">
            <span class="status-ring"></span>
            ${iconHtml}
          </div>
          <div class="node-label">${mod.label}</div>
          <div class="node-sub">${
            status === 'running' ? '⚙️ dreht …' :
            status === 'success' ? '✓ fusioniert' :
            status === 'failed' ? '✗ fehler' :
            active ? '⏳ bereit' : '⛔ deaktiviert'
          }</div>
        </div>
      `;
      if (idx < PIPELINE.length - 1) {
        const nextStatus = state.status[idx + 1];
        let conn = '';
        if (status === 'success' && (nextStatus === 'success' || nextStatus === 'running' || nextStatus === 'failed')) conn = 'success';
        else if (status === 'running') conn = 'running';
        else if (status === 'failed') conn = 'failed';
        html += `<div class="stage-connector ${conn}"></div>`;
      }
    });
    stagesEl.innerHTML = html;
    updateStats();
  }

  function renderLogs() {
    let html = '';
    state.logs.forEach(log => {
      html += `
        <div class="log-item ${log.type}">
          <span class="icon">${log.icon}</span>
          <span class="text">${log.text}</span>
          <span class="time">${log.time}</span>
        </div>
      `;
    });
    logEl.innerHTML = html;
    logEl.scrollTop = logEl.scrollHeight;
  }

  function updateStats() {
    const success = state.status.filter(s => s === 'success').length;
    const running = state.status.filter(s => s === 'running').length;
    const failed = state.status.filter(s => s === 'failed').length;
    $('successCount').textContent = success;
    // Metriken
    let v3 = '–', v9 = '–', v81 = '–';
    if (state.results[0]) {
      const r = state.results[0];
      v3 = r.drei ?? r.three ?? r[3] ?? r.value ?? '?';
    }
    if (state.results[1]) {
      const r = state.results[1];
      v9 = r.neun ?? r.nine ?? r[9] ?? r.value ?? '?';
    }
    if (state.results[2]) {
      const r = state.results[2];
      v81 = r.einundachtzig ?? r.eightyone ?? r[81] ?? r.value ?? '?';
    }
    $('metric3').textContent = v3;
    $('metric9').textContent = v9;
    $('metric81').textContent = v81;

    // Fixpunkt & Modus
    $('fixDisplay').textContent = state.fix.toFixed(3);
    $('modeDisplay').textContent = state.modeOrbit;
    $('stateDisplay').textContent = state.stateOrbit;
  }

  // ─── PIPELINE AUSFÜHREN ──────────────────────────────────────
  async function runPipeline() {
    if (state.isRunning) return;
    state.isRunning = true;
    triggerBtn.disabled = true;
    triggerBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Fusion läuft …';

    state.status = PIPELINE.map(() => 'pending');
    state.results = PIPELINE.map(() => null);
    state.logs = [];
    state.logs.push({ icon: '⚡', text: `<strong>PIPELINE2</strong> · Start (${state.mode})`, time: getTime(), type: 'info' });
    renderStages();
    renderLogs();
    updateTimestamp();

    for (let i = 0; i < PIPELINE.length; i++) {
      if (!state.activeStages[i]) {
        state.status[i] = 'pending';
        state.logs.push({ icon: '⏭️', text: `<strong>${PIPELINE[i].label}</strong> · übersprungen`, time: getTime(), type: 'warning' });
        renderStages();
        renderLogs();
        continue;
      }

      state.status[i] = 'running';
      renderStages();
      state.logs.push({ icon: '⚙️', text: `<strong>${PIPELINE[i].label}</strong> · Zahnrad dreht …`, time: getTime(), type: 'warning' });
      renderLogs();

      try {
        const mod = moduleCache[PIPELINE[i].key];
        const core = moduleCache.coreScan ? moduleCache.coreScan() : {};
        const result = mod.run(core);
        state.results[i] = result;
        state.status[i] = 'success';
        const str = typeof result === 'object' ? JSON.stringify(result).slice(0,60) : String(result);
        state.logs.push({
          icon: '✅',
          text: `<strong>${PIPELINE[i].label}</strong> · fusioniert → ${str}`,
          time: getTime(),
          type: 'success'
        });
      } catch (err) {
        state.status[i] = 'failed';
        state.logs.push({
          icon: '❌',
          text: `<strong>${PIPELINE[i].label}</strong> · Fehler: ${err.message || err}`,
          time: getTime(),
          type: 'error'
        });
      }
      renderStages();
      renderLogs();
      updateTimestamp();
      await new Promise(r => setTimeout(r, 700));
    }

    state.logs.push({ icon: '🏁', text: '<strong>PIPELINE2</strong> · Fusion abgeschlossen', time: getTime(), type: 'info' });
    renderLogs();
    state.isRunning = false;
    triggerBtn.disabled = false;
    triggerBtn.innerHTML = '<i class="fas fa-play"></i> Pipeline auslösen';
    updateTimestamp();
    updateStats();
  }

  // ─── MANUELLER SCHRITT ──────────────────────────────────────
  async function manualStep(idx) {
    if (state.isRunning || !state.activeStages[idx]) return;
    const mod = PIPELINE[idx];
    state.status = state.status.map((_, i) => i === idx ? 'running' : 'pending');
    state.results = state.results.map(() => null);
    state.logs = [];
    state.logs.push({ icon: '🔧', text: `<strong>Manuell</strong> · ${mod.label}`, time: getTime(), type: 'info' });
    renderStages();
    renderLogs();
    updateTimestamp();

    try {
      const modObj = moduleCache[mod.key];
      const core = moduleCache.coreScan ? moduleCache.coreScan() : {};
      const result = modObj.run(core);
      state.results[idx] = result;
      state.status[idx] = 'success';
      const str = typeof result === 'object' ? JSON.stringify(result).slice(0,60) : String(result);
      state.logs.push({
        icon: '✅',
        text: `<strong>${mod.label}</strong> · → ${str}`,
        time: getTime(),
        type: 'success'
      });
    } catch (err) {
      state.status[idx] = 'failed';
      state.logs.push({
        icon: '❌',
        text: `<strong>${mod.label}</strong> · Fehler: ${err.message || err}`,
        time: getTime(),
        type: 'error'
      });
    }
    renderStages();
    renderLogs();
    updateTimestamp();
    updateStats();
  }

  // ─── EVENTS ────────────────────────────────────────────────────
  triggerBtn.addEventListener('click', runPipeline);

  resetBtn.addEventListener('click', () => {
    if (state.isRunning) return;
    state.status = PIPELINE.map(() => 'pending');
    state.results = PIPELINE.map(() => null);
    state.logs = [];
    state.logs.push({ icon: '🔄', text: 'Pipeline zurückgesetzt', time: getTime(), type: 'info' });
    renderStages();
    renderLogs();
    updateTimestamp();
    updateStats();
  });

  toggleBtn.addEventListener('click', () => {
    state.mode = state.mode === 'SIM' ? 'REAL' : 'SIM';
    modeLabel.textContent = state.mode;
    state.logs.push({ icon: '🔄', text: `Modus → ${state.mode}`, time: getTime(), type: 'info' });
    renderLogs();
    state.status = PIPELINE.map(() => 'pending');
    state.results = PIPELINE.map(() => null);
    renderStages();
    updateStats();
  });

  // Manuelle Buttons
  $('btnP0').addEventListener('click', () => manualStep(0));
  $('btnP1').addEventListener('click', () => manualStep(1));
  $('btnP2').addEventListener('click', () => manualStep(2));

  // ─── GHOST‑SCAN SIMULATION (Fixpunkt) ──────────────────────────
  function ghostSim() {
    // Simuliere leichte Drift
    state.fix += (Math.random() - 0.48) * 0.02;
    state.fix = Math.min(0.95, Math.max(0.15, state.fix));
    state.modeOrbit = getModeFromFix(state.fix);
    state.stateOrbit = state.fix > 0.7 ? 'STABIL' : state.fix > 0.4 ? 'MODERAT' : 'LOW';
    updateStats();
  }
  setInterval(ghostSim, 4000);

  // ─── INIT ──────────────────────────────────────────────────────
  function init() {
    state.logs.push({ icon: '💡', text: 'PIPELINE2 bereit · Modus SIM', time: getTime(), type: 'info' });
    state.logs.push({ icon: '🛠️', text: 'P0/P1/P2 als Einzelschritt nutzbar', time: getTime(), type: 'info' });
    renderStages();
    renderLogs();
    updateTimestamp();
    updateStats();
  }
  init();
</script>

</body>
</html>
