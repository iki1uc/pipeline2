<script type="module">

import { QI } from "./QI.js";
import { coreScan } from "./coreScan.js";

import { P0 } from "./pipelineP0.js";
import { P1 } from "./pipelineP1.js";
import { P2 } from "./pipelineP2.js";

window.out = function(msg){
    document.getElementById("out").innerText = msg;
};

// =========================
// QI — GLOBAL FUNCTIONS
// =========================

window.qi_p2 = function(){
    const core = coreScan();
    out("QI · PIPELINE2\n" + JSON.stringify(QI.scan(P2.run(core)), null, 2));
};

window.qi_master = function(){
    out("QI · MASTER-KERN\n" + JSON.stringify(QI.scan(coreScan()), null, 2));
};

window.qi_respo = function(){
    const core = coreScan();
    out("QI · RESPO\n" + JSON.stringify(QI.scan(core.respo360), null, 2));
};

// =========================
// PIPELINE2 — GLOBAL FUNCTIONS
// =========================

window.p2_raw = function(){
    out("PIPELINE2 · RAW → WAKE\n" + JSON.stringify(P0.run(coreScan()), null, 2));
};

window.p2_structure = function(){
    out("PIPELINE2 · RAW → STRUCTURE\n" + JSON.stringify(P1.run(coreScan()), null, 2));
};

window.p2_vector = function(){
    out("PIPELINE2 · STRUCTURE → VECTOR\n" + JSON.stringify(P2.run(coreScan()), null, 2));
};

</script>
