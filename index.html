<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>PIPELINE2 · Operator-Ebene · iki1uc</title>

<style>
    body {
        background:#000;
        color:#0f0;
        font-family:Consolas, monospace;
        padding:20px;
    }
    h1 { color:#6cf; }
    pre {
        background:#111;
        padding:12px;
        border:1px solid #333;
        border-radius:6px;
        color:#0f0;
    }
    .block { margin-bottom:20px; }
</style>

<script type="module">

// =========================
// Loader für .item Dateien
// =========================

async function loadItem(name){
    const res = await fetch(name);
    return await res.text();
}

// =========================
// PIPELINE2 Start
// =========================

async function PIPELINE2_START(){

    // UC-Fusion Items
    const fusion01 = await loadItem("uc-fusion-01.item");
    const fusion02 = await loadItem("uc-fusion-02.item");

    // UC-Operator
    const operator = await loadItem("uc-operator.item");

    // POS-Router
    const posRouter = await loadItem("pos-router.uc.item");

    // ID-Module
    const id = await loadItem("ID.html");

    return {
        fusion: {
            fusion01,
            fusion02
        },
        operator,
        posRouter,
        id
    };
}

// =========================
// UI
// =========================

window.onload = async () => {
    const out = await PIPELINE2_START();
    document.getElementById("out").textContent =
        JSON.stringify(out, null, 2);
};
</script>

</head>

<body>

<h1>PIPELINE2 · Operator-Ebene · iki1uc</h1>

<div class="block">
    <pre id="out">Lade PIPELINE2…</pre>
</div>

</body>
</html>
